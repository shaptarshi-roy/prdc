; supervisord config for the worker container
;
; Runs two long-lived processes:
;   1. Messenger consumer    — processes ValidateBatch jobs
;   2. cron daemon           — fires the daily file-purge task
;
; If either dies, supervisord restarts it. Both log to stdout/stderr so
; Docker captures everything.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=app

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:messenger]
command=php /app/bin/console messenger:consume validation
        --time-limit=3600
        --memory-limit=256M
        -vv
directory=/app
user=app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cron]
command=cron -f -L 15
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PHP-FPM pool override for the P-RDC api container.
;
; Listens on a Unix socket inside the shared `fpm_socket` volume that
; Caddy also mounts. This makes the FPM endpoint unreachable over any
; network — TCP port 9000 is not exposed at all.
;
; Why: The api container sits on both the `public` (with Caddy) and
; `internal` (with worker + db) Docker networks. If FPM listened on a
; TCP port, a compromised worker container could connect directly to
; the api's FPM port, bypassing Caddy and spoofing the client-cert
; headers Caddy normally adds. A Unix socket has no IP-level access
; surface — only Caddy, which mounts the same volume, can reach it.

[www]
user = app
group = app

listen           = /var/run/fpm/php-fpm.sock
listen.owner     = app
listen.group     = app
; 0666 — the socket lives on a Docker volume shared only with the proxy
; container. There's no third party who could connect; relaxing the mode
; just spares us from matching UIDs across the two images.
listen.mode      = 0666

; Standard pool sizing — adjust based on expected concurrency.
pm                      = dynamic
pm.max_children         = 20
pm.start_servers        = 4
pm.min_spare_servers    = 2
pm.max_spare_servers    = 6
pm.max_requests         = 500

; Surface FPM errors on stderr so Docker captures them.
catch_workers_output = yes
decorate_workers_output = no

; Strip any inbound X-Client-Cert-* headers that Caddy didn't set itself.
; Belt-and-suspenders on top of the Unix socket — even if some future
; refactor exposes FPM over TCP, the headers can't be forged through this
; pool because the FastCGI parameter passthrough is whitelist-only below.
clear_env = yes
